# 输入示例:一个社交故事的目标场景
# 运行:python -m autismcare generate --config config/example_story.yaml

child_name: 乐乐          # 孩子的名字(会出现在故事里,增强代入感)
age: 6                    # 年龄(影响用词与句子长度)
situation: 第一次去看牙医  # 目标场景 / 要学习的情境
goal: 帮助孩子理解看牙医的完整流程,知道会发生什么、自己可以怎么做,从而减少焦虑
interests:               # 孩子的兴趣(用于个性化、提升接受度)
  - 恐龙
  - 小汽车
sensory_notes: 对强光和尖锐的声音比较敏感   # 感官特点(生成时会照顾到)
reading_level: simple    # simple(简单) | medium(适中)
project_slug: dentist_visit   # 输出文件夹名(留空则自动生成)
