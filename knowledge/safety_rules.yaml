# =====================================================================
# 安全 / 合规规则 —— 硬性,贯穿整个生成流程。
# validate.py 会读取本文件做机器校验;package.py 会把免责声明写进产物。
# =====================================================================

# --- 免责声明(强制附带到每个产物,中英双语)---
disclaimer:
  zh: |
    【免责声明】本内容由 AI 依据循证方法自动生成,仅作为家庭与教学的"辅助/教育工具",
    不构成医疗建议,不能替代专业评估、诊断或治疗。每个自闭症孩子的情况不同,
    使用前请由特教老师、康复师或相关专业人员审核并按孩子的实际情况调整。
    本内容不做任何"治愈"或疗效承诺。若孩子有明显情绪或行为困难,请咨询专业机构。
  en: |
    [Disclaimer] This content is generated by AI based on evidence-informed methods and
    is intended only as a supportive / educational aid for families and educators.
    It is NOT medical advice and does NOT replace professional assessment, diagnosis,
    or treatment. Every autistic child is different; please have a special educator,
    therapist, or qualified professional review and adapt it before use. No claim of
    "cure" or clinical efficacy is made. If a child shows significant distress, consult a professional.

# --- 每个产物默认标记(草稿 / 需专业审核)---
default_flags:
  - draft
  - needs_professional_review

# --- 机器可校验的硬约束 ---
lint:
  # 句型基本比:(描述+观点+肯定) / 指导 >= 该值
  min_descriptive_per_directive: 2.0

  # 必须包含第一人称(以孩子视角讲述)
  require_first_person: true
  first_person_markers_zh: ["我"]
  first_person_markers_en: [" I ", "I ", " my ", " me "]

  # 场景数量范围
  min_scenes: 5
  max_scenes: 12

  # 单屏中文字数上限(过长不利于阅读/理解)——超过给警告
  max_zh_chars_per_scene: 60

# --- 负面 / 恐吓 / 绝对化用语黑名单(命中即拦截为 blocked)---
# 社交故事应正向、具体、留弹性;出现这些词往往意味着框架不当。
banned_words:
  zh:
    - 可怕
    - 恐怖
    - 疼死
    - 惩罚
    - 打针很疼
    - 坏孩子
    - 必须每次
    - 绝对不许
    - 不听话
    - 会受伤
  en:
    - terrible
    - scary
    - horrible
    - punish
    - bad boy
    - bad girl
    - you must always
    - never ever

# --- 需人工复核提醒(warning,不拦截,但写进 review 报告)---
review_reminders_zh:
  - "请核对文中引用文献的卷期/页码/DOI 是否准确(见 citations.yaml 中 verify: true 的条目)。"
  - 请确认故事内容与该孩子的真实经历、机构流程一致(如就诊流程、老师称呼)。
  - 商用售卖前请确认已获得 "Social Stories™" 相关名称使用的合规审阅(该词为 Carol Gray 提出的方法名)。
  - 请由专业人员确认句子难度、节奏与配音语速适合目标年龄段。
