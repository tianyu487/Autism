# =====================================================================
# 技能领域库:社交互动 Social Interaction
# 每个目标(target)标注:发展层级 level、中英描述、可用循证方法 methods、
#   先决技能 prereq_zh、情境例子 examples_zh、可观察达标指标 indicator_zh。
# 生成时这些一并注入,帮助模块选准目标、写出可测量的 learning_objective。
# =====================================================================

# 心理理论(观点采择)证据已核验入库(2026-07-13),现引用于 perspective_taking 区:
#   - [[baron_cohen_1985]] 错误信念 / Sally-Anne 范式(ToM 奠基)
#   - [[howlin_1999]] Teaching Children with Autism to Mind-Read(观点采择教学实操)
#   - [[wellman_2001]] 错误信念理解发展元分析
#   - [[fisher_happe_2005]] 心理理论教学对照研究(ToM 可教)
#   卷期/DOI/ISBN 已核对,现置 verify:true,商用前再终核一次原文。

id: social_interaction
name_zh: 社交互动
name_en: Social Interaction
one_line_zh: 从共同注意到友谊的社交技能发展序列;帮助生成器为孩子挑选发展适宜、循证的训练目标。

evidence_note_zh: |
  典型发展顺序大致为:响应性共同注意(RJA)→ 主动性共同注意(IJA)→ 模仿 → 游戏 → 语言。
  自闭症儿童常呈非典型顺序(物体/动作模仿、甚至语言可能先于共同注意,IJA 出现最晚、最难)。
  实务要点:共同注意上先教"响应"再教"发起";目标应基于评估的当前水平,而非年龄。

developmental_levels:
  - key: pre
    zh: 基础前技能
    en: Prerequisite
  - key: respond
    zh: 回应
    en: Responding
  - key: initiate
    zh: 发起
    en: Initiating
  - key: sustain
    zh: 维持与拓展
    en: Sustaining & extending

frameworks_zh:
  - "SCERTS(社会沟通-情绪调节-交往支持):按 社交伙伴期→语言伙伴期→对话伙伴期 序列化社交目标。见 [[prizant_2006]]"
  - "VB-MAPP:社交行为/社交游戏、集体技能等里程碑,可作技能分级骨架。见 [[sundberg_2008]]"
  - "中国实务多用 VB-MAPP / ABLLS-R / PEP-3 评估当前水平后定目标。"

skill_areas:
  - id: prerequisites
    name_zh: 基础前技能
    name_en: Prerequisites
    targets:
      - level: pre
        zh: 对名字有回应,能与人有短暂的眼神接触/共同注视
        en: Responds to name; brief eye contact / shared gaze
        methods: [naturalistic_intervention, prompting, reinforcement]
        prereq_zh: 无(最基础)
        examples_zh:
          - 叫名字时抬头看向说话的人
          - 顺着大人手指看向被指的物品
        indicator_zh: 叫名字 5 次中≥3 次有回应
      - level: pre
        zh: 简单模仿(动作模仿 → 物体操作模仿)
        en: Simple imitation (motor → object)
        methods: [modeling, video_modeling, prompting]
        prereq_zh: 能注视示范者
        examples_zh:
          - 模仿拍手、挥手
          - 模仿把积木放进桶里
        indicator_zh: 能即时模仿 2–3 个新动作
      - level: pre
        zh: 社会性参照:看大人的表情/反应判断该如何行动,回以社会性微笑
        en: "Social referencing: checks an adult's face/reaction to guide own response; returns a social smile"
        methods: [naturalistic_intervention, modeling, reinforcement]
        prereq_zh: 眼神接触、对名字有回应
        examples_zh:
          - 遇到陌生玩具时先看大人表情再决定要不要碰
          - 大人对着他微笑时回以微笑
        indicator_zh: 不确定情境下 3 次中≥2 次会看向大人寻求线索
    citations: [sundberg_2008, schreibman_2015]

  - id: joint_attention
    name_zh: 共同注意
    name_en: Joint Attention
    targets:
      - level: respond
        zh: 响应他人的指向/视线(RJA):顺着看向被指的东西
        en: Responds to others' pointing/gaze (RJA)
        methods: [naturalistic_intervention, prompting]
        prereq_zh: 简单模仿、眼神接触
        examples_zh:
          - 大人指向玩具,孩子看过去
          - 跟随大人视线看向窗外的鸟
        indicator_zh: 响应他人指向 3 次中≥2
      - level: initiate
        zh: 主动发起分享性注意(IJA):用手指、展示、来回看来分享兴趣
        en: Initiates joint attention (IJA) by pointing, showing, gaze-shifting
        methods: [naturalistic_intervention, reinforcement]
        prereq_zh: 能响应共同注意
        examples_zh:
          - 看到飞机,指给大人看并在大人与飞机之间来回看
          - 举起自己的画作展示给大人
        indicator_zh: 每节课能主动发起分享性注意≥2 次
    citations: [kasari_2006, schreibman_2015]

  - id: turn_taking
    name_zh: 轮流
    name_en: Turn-Taking
    targets:
      - level: respond
        zh: 在结构化活动中等待并接受轮流
        en: Waits for and accepts turns in a structured activity
        methods: [video_modeling, social_narratives, modeling, reinforcement]
        prereq_zh: 能短暂等待
        examples_zh:
          - 滚球游戏里等对方把球滚回来
          - 桌游里等到自己的回合再动
        indicator_zh: 结构化活动中能等待并完成 3 个来回
      - level: initiate
        zh: 物件轮流 → 游戏轮流 → 对话轮流
        en: Turn-taking with objects → games → conversation
        methods: [video_modeling, scripting, social_skills_training]
        prereq_zh: 能接受物件轮流
        examples_zh:
          - 轮流各搭一块积木
          - 你一句我一句的问答
        indicator_zh: 能完成一段 3 回合以上的对话轮流
    citations: [nac_2015, sundberg_2008]

  - id: sharing_requesting
    name_zh: 分享与请求
    name_en: Sharing & Requesting
    targets:
      - level: respond
        zh: 等待、分享后再拿回、把物品给出
        en: Waits, shares-then-retrieves, gives an item
        methods: [video_modeling, social_narratives, prompting]
        prereq_zh: 能短暂等待
        examples_zh:
          - 把蜡笔分一支给同伴
          - 玩一会儿后按约定把玩具给出
        indicator_zh: 提示下能主动分享或给出 1 次
      - level: initiate
        zh: 主动请求物品/帮助(可借图片沟通)
        en: Requests items/help (may use picture communication)
        methods: [aac_pecs, naturalistic_intervention, time_delay]
        prereq_zh: 有基本沟通方式(口语/图片/手势)
        examples_zh:
          - 用词或图片请求"我要饼干"
          - 请求帮助"帮我打开"
        indicator_zh: 需要时能主动发起请求(可借图片)
    citations: [nac_2015, bondy_frost_1994]

  - id: initiating_responding
    name_zh: 发起与回应同伴
    name_en: Initiating & Responding to Peers
    targets:
      - level: respond
        zh: 回应同伴的发起(被邀请时加入、回应问候)
        en: Responds to a peer's initiation (joins when invited, returns a greeting)
        methods: [video_modeling, social_skills_training, prompting]
        prereq_zh: 眼神接触、简单语言/手势
        examples_zh:
          - 被邀请时点头加入
          - 同伴打招呼时回应"你好"
        indicator_zh: 同伴发起时 3 次中≥2 有恰当回应
      - level: initiate
        zh: 主动发起互动:打招呼、邀请一起玩、开启话题
        en: "Initiates interaction: greets, invites to play, starts a topic"
        methods: [scripting, peer_based_intervention, video_modeling]
        prereq_zh: 能回应同伴的发起
        examples_zh:
          - 走近同伴说"你好"
          - 说"我们一起玩吧"
        indicator_zh: 每节课能主动发起互动≥2 次
      - level: sustain
        zh: 完成问候与告别的社交常规(打招呼、说再见、回应寒暄)
        en: "Completes greeting and parting routines (says hello, goodbye, returns small talk)"
        methods: [scripting, video_modeling, social_skills_training]
        prereq_zh: 能主动发起互动、有基本口语或替代沟通
        examples_zh:
          - 进教室时对老师和同伴说"早上好"
          - 离开时挥手说"再见,明天见"
        indicator_zh: 到达或离开时 3 次中≥2 次能主动完成问候或告别
    citations: [krantz_mcclannahan_1993, chan_2009]

  - id: cooperative_play
    name_zh: 合作游戏
    name_en: Cooperative Play
    targets:
      - level: respond
        zh: 平行游戏 → 联合游戏(同一活动中互相关注)
        en: Parallel play → associative play
        methods: [naturalistic_intervention, peer_based_intervention, modeling]
        prereq_zh: 能容忍同伴在旁
        examples_zh:
          - 在同一沙池各玩但偶尔互看
          - 用同一套积木一起搭、你递我接
        indicator_zh: 联合游戏中能互相关注或给予材料
      - level: sustain
        zh: 合作/协商游戏:分工、遵守规则、共同达成目标
        en: "Cooperative/negotiated play: roles, rules, shared goals"
        methods: [peer_based_intervention, video_modeling, social_skills_training]
        prereq_zh: 能联合游戏、能等待轮流
        examples_zh:
          - 分工一起搭一座塔
          - 协商"你当医生我当病人"
        indicator_zh: 能在有规则的合作游戏里坚持到结束
    citations: [chan_2009, kasari_2006]

  - id: perspective_taking
    name_zh: 观点采择与心理理论
    name_en: Perspective-Taking & Theory of Mind
    targets:
      - level: respond
        zh: 视觉观点采择:注意他人在看什么,理解"别人看到的和我不一样"
        en: "Visual perspective-taking: notices what others look at; grasps that others may see differently"
        methods: [naturalistic_intervention, modeling, prompting]
        prereq_zh: 能响应他人指向或视线、能简单模仿
        examples_zh:
          - 顺着大人的视线找到他正在看的东西
          - 把图画转向对面的人给他看,而不是只朝着自己
        indicator_zh: 3 次中≥2 次能说出或指出他人正在看的东西
      - level: initiate
        zh: 愿望与情绪归因:考虑他人可能有不同喜好,读线索猜他人感受
        en: "Desire and emotion attribution: considers others may like different things; reads cues to infer feelings"
        methods: [social_skills_training, video_modeling, cognitive_behavioral]
        prereq_zh: 能视觉观点采择、能命名基本情绪
        examples_zh:
          - 给同伴挑玩具前先问"你喜欢哪一个"
          - 看到同伴皱眉、握拳,猜他"生气了"
        indicator_zh: 能据表情或情境线索恰当推断他人感受 3 次中≥2 次
      - level: sustain
        zh: 信念观点采择:理解他人"知道/不知道"的不同,做简单错误信念准备
        en: "Belief perspective-taking: understands others may know or not know differently; readiness for simple false belief"
        methods: [social_narratives, cognitive_behavioral, social_skills_training]
        prereq_zh: 能做愿望或情绪归因、能听懂简单叙事
        examples_zh:
          - 明白"我藏东西时妈妈没看见,所以她不知道它在哪里"
          - 玩"社交小侦探":根据线索猜别人心里在想什么
        indicator_zh: 能在简单情境中说出他人"不知道"我所知道的信息
    citations: [baron_cohen_1985, howlin_1999, wellman_2001, fisher_happe_2005, beaumont_sofronoff_2008, golan_2010]

  - id: friendship_group
    name_zh: 友谊与集体技能
    name_en: Friendship & Group Skills
    targets:
      - level: sustain
        zh: 参与集体活动、协商、维持关系、温和处理冲突
        en: Participates in groups, negotiates, maintains relationships, handles conflict gently
        methods: [social_skills_training, cognitive_behavioral, self_management]
        prereq_zh: 能合作游戏、初步观点采择
        examples_zh:
          - 参加集体游戏并遵守指令
          - 意见不同时用平和方式协商
        indicator_zh: 能在小组活动中参与并温和处理一次分歧
      - level: sustain
        zh: 维持对话:保持在同一话题、轮流发言、主动问及对方
        en: "Sustains conversation: stays on topic, takes conversational turns, asks about the other person"
        methods: [social_skills_training, scripting, video_modeling]
        prereq_zh: 能对话轮流、能回应同伴发起
        examples_zh:
          - 同伴说完后自己补一句相关的,不突然换话题
          - 主动问"你周末做了什么"
        indicator_zh: 能围绕一个话题维持 3 个来回并至少问对方 1 个问题
      - level: sustain
        zh: 加入正在进行的集体游戏,并能温和应对被拒绝
        en: "Joins an ongoing group activity and copes gently with being turned down"
        methods: [social_skills_training, peer_based_intervention, cognitive_behavioral]
        prereq_zh: 能发起互动、初步观点采择
        examples_zh:
          - 先在旁观察再问"我可以一起玩吗"
          - 被拒绝时不发脾气,改找别的同伴或活动
        indicator_zh: 能用恰当方式请求加入,并在被拒时保持平和 1 次
    citations: [gates_2017, steinbrenner_2020, nac_2015]

notes_zh:
  - 目标须依据评估的当前发展水平选取,并做个别化调整;所有产出仍为需专业审核的草稿。
  - methods 列出的是"证据上适配该目标"的方法;具体到某孩子由专业人员定夺。
  - 问候/告别、保持话题、问及对方等对话技能的语言机制与 communication_language 领域协同,此处仅取其社交互动一面,勿与之重复。
  - perspective_taking(观点采择)区直接支撑"社交小侦探"玩法;心理理论奠基与教学证据([[baron_cohen_1985]]、[[howlin_1999]]、[[wellman_2001]]、[[fisher_happe_2005]])已核验入库(verify:true)。
