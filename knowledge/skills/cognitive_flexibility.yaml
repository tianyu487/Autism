# =====================================================================
# 技能领域库:认知灵活性与问题解决 Cognitive Flexibility & Problem-Solving
# 执行功能相邻、面向儿童的技能序列;帮助生成器为孩子挑选发展适宜、
# 循证的训练目标(容忍变化、活动转换、灵活思考、问题解决、等待与自我监控)。
# 每个目标(target)标注:发展层级 level、中英描述、可用循证方法 methods、
#   先决技能 prereq_zh、情境例子 examples_zh、可观察达标指标 indicator_zh。
# =====================================================================
#
# 执行功能证据已核验入库(2026-07-13):Kenworthy 等 2014 RCT = [[kenworthy_2014]];
#   Unstuck and On Target 课程 = [[cannon_2011]]。二者卷期/DOI/ISBN 已核对,
#   现置 verify:true,商用前再终核一次原文。
# =====================================================================

id: cognitive_flexibility
name_zh: 认知灵活性与问题解决
name_en: Cognitive Flexibility & Problem-Solving
one_line_zh: 从容忍变化到自主问题解决的执行功能相邻技能序列;帮助生成器为孩子挑选发展适宜、循证的训练目标。

evidence_note_zh: |
  认知僵化(坚持同一、难以转换、遇变即崩)是自闭症的常见特征;灵活性可教、可练。
  实务大方向:先降低情境的不确定性(预告、视觉日程、可预期常规),再逐步教替代与选择。
  能力发展大致为:在支持下容忍变化 → 借步骤/自我对话应对 → 自发迁移到真实游戏与社交。
  以「认知行为策略、自我管理、视觉支持、社交叙事」等已确立方法为落点,不对特定课程夸大疗效。

developmental_levels:
  - key: emerging
    zh: 萌芽(有支持下)
    en: Emerging
  - key: developing
    zh: 发展中(借步骤/自我对话)
    en: Developing
  - key: applying
    zh: 应用与泛化(自发迁移)
    en: Applying

frameworks_zh:
  - "认知行为策略(CBIS)是灵活思考与问题解决的核心方法,教「想法→情绪→行为」链、自我对话与应对。见 [[wood_2009]]、[[steinbrenner_2020]]"
  - "SCERTS 的情绪调节(交互式调节→自我调节)与容忍变化目标可作分级骨架。见 [[prizant_2006]]"
  - "自我调节与「停一停想一想」常借 Zones of Regulation 与神奇 5 分量表的应对策略框架。见 [[kuypers_2011]]、[[buron_curtis_2003]]"
  - "执行功能课程(如 Unstuck and On Target)把灵活性拆成可教的口头语与步骤,强调情境中练习与泛化;对比社交技能干预的 RCT 显示问题解决/灵活性改善更大。见 [[cannon_2011]]、[[kenworthy_2014]]"

skill_areas:
  - id: tolerating_change
    name_zh: 容忍变化与应对意外
    name_en: Tolerating Change & Coping with the Unexpected
    targets:
      - level: emerging
        zh: 在有预告和支持下,接受一个小的、已知的变化(换座位、换杯子)
        en: Accepts a small, previewed change with support (seat swapped, different cup)
        methods: [visual_supports, social_narratives, prompting, reinforcement]
        prereq_zh: 能跟随简单视觉提示
        examples_zh:
          - 老师提前用图卡说明今天先画画再玩积木,孩子接受
          - 常用的红杯子没有了,换蓝杯子仍能喝水
        indicator_zh: 5 次预告过的小变化中≥3 次能平稳接受、无明显崩溃
      - level: developing
        zh: 应对未预告的意外(关门了、卖光了、玩具坏了),用一句应对语并转向替代方案
        en: Copes with an unannounced surprise (closed, sold out, broken toy) using a coping phrase and a backup
        methods: [cognitive_behavioral, social_narratives, video_modeling, prompting]
        prereq_zh: 能接受已预告的小变化
        examples_zh:
          - 想买的酸奶卖光了,说「没关系,换一个」并选别的
          - 心爱的小车轮子掉了,先说「可以修」并先做别的
        indicator_zh: 遇意外时能在提示内说出应对语并接受替代,3 次中≥2 次不升级为崩溃
      - level: developing
        zh: 被告知做错了或答错了时，接受纠正、不固执坚持，愿意修改或再试一次
        en: "When told an answer or action is wrong, accepts the correction without insisting, and is willing to revise or try again"
        methods: [cognitive_behavioral, social_narratives, video_modeling, reinforcement]
        prereq_zh: 能接受已预告的小变化、有基本情绪命名
        examples_zh:
          - 老师说「这道题再看看」，不发脾气，擦掉重做
          - 搭的桥倒了，听到「换个搭法」愿意改而不是坚持原样
        indicator_zh: 被纠正时 5 次中≥3 次能平稳接受并修改，不升级为对抗或崩溃
      - level: applying
        zh: 在多个自然情境中自发应对未预告的变化或意外，自我平复、调整计划，必要时寻求帮助
        en: "Spontaneously copes with unannounced changes or surprises across several natural settings, self-calming, adjusting the plan, and seeking help when needed"
        methods: [self_management, cognitive_behavioral, social_narratives, video_modeling]
        prereq_zh: 能对未预告的意外说出应对语并转向替代方案
        examples_zh:
          - 校车路线临时改道，自己说「没关系，会到的」并安坐
          - 春游因雨改到室内，能自我调整并参与替代安排
        indicator_zh: 每周在自然情境中自发平稳应对未预告的变化≥3 次，多数无需成人提示
    citations: [nac_2015, buron_curtis_2003, gray_garand_1993, steinbrenner_2020, lee_2007]

  - id: transitions
    name_zh: 活动转换
    name_en: Transitions Between Activities
    targets:
      - level: emerging
        zh: 在视觉日程与倒计时提示下,结束一个中性活动并转到下一个
        en: Ends a neutral activity and moves to the next one with a visual schedule and countdown
        methods: [visual_supports, prompting, reinforcement, video_modeling]
        prereq_zh: 能看懂简单图片日程
        examples_zh:
          - 看着日程条,做完拼图把它翻到「完成」再去洗手
          - 计时器响后从沙盘收工去桌前
        indicator_zh: 借日程/计时提示完成转换,5 次中≥4 次无需身体提示
      - level: developing
        zh: 结束一个偏好活动(平板、最爱的玩具)并转到较不偏好的活动
        en: Stops a preferred activity (tablet, favorite toy) and transitions to a less-preferred one
        methods: [social_narratives, self_management, time_delay, reinforcement]
        prereq_zh: 能在中性活动间转换、能短暂等待
        examples_zh:
          - 用「还剩 2 次就结束」预告后关掉平板去吃饭
          - 收好最爱的恐龙,去参加集体活动
        indicator_zh: 偏好活动结束提示后 1 分钟内完成转换,3 次中≥2 次
      - level: applying
        zh: 面对临时的日程改动（活动取消、顺序调换）能自我调整并接受，自发查看或更新自己的日程
        en: "Adjusts to and accepts last-minute schedule changes (an activity cancelled or reordered), spontaneously checking or updating their own schedule"
        methods: [self_management, visual_supports, cognitive_behavioral, social_narratives]
        prereq_zh: 能结束偏好活动并转到较不偏好的活动
        examples_zh:
          - 看到日程上「体育课改成阅读」，自己调整并去拿书
          - 原定的客人没来，能接受改玩别的而不纠缠
        indicator_zh: 面对临时日程改动能在提示内自我调整，每周记录≥3 次平稳转换
    citations: [steinbrenner_2020, nac_2015, buron_curtis_2003, lee_2007]

  - id: flexible_thinking
    name_zh: 灵活思考(不止一种办法)
    name_en: Flexible Thinking (More Than One Way)
    targets:
      - level: emerging
        zh: 理解同一件事可以有不止一种做法/答案,能接受第二种办法
        en: Understands there can be more than one way or answer, and accepts a second way
        methods: [modeling, video_modeling, cognitive_behavioral, prompting]
        prereq_zh: 能模仿示范、能听懂简单二选一
        examples_zh:
          - 去公园的路被封,接受「换另一条路也能到」
          - 积木搭法不止一种,愿意试同伴的搭法
        indicator_zh: 成人给出替代方案时,3 次中≥2 次能接受并尝试第二种办法
      - level: developing
        zh: 自己想出「Plan B」,并理解别人的想法/喜好可能与自己不同
        en: Generates a Plan B and recognizes that others' ideas or preferences may differ
        methods: [cognitive_behavioral, social_narratives, video_modeling]
        prereq_zh: 能接受成人提出的替代方案
        examples_zh:
          - 下雨不能去操场,自己提出「那我们在室内玩」
          - 明白同伴喜欢的游戏和自己不一样,愿意轮到对方选
        indicator_zh: 遇受阻情境能自己说出至少 1 个 Plan B,每周记录≥3 次
      - level: developing
        zh: 为一个普通物件想出多种用途，或为一个问题想出多个不同点子（发散生成）
        en: "Generates multiple uses for a common object, or several different ideas for one problem (flexible generation)"
        methods: [modeling, cognitive_behavioral, video_modeling, reinforcement]
        prereq_zh: 能接受同一件事有不止一种做法
        examples_zh:
          - 说出杯子除了喝水，还能装笔、当印章、扣住小球
          - 「纸箱可以做什么」能说出至少 3 种玩法
        indicator_zh: 给一个物件或问题时能说出≥3 个不同点子，3 次中≥2 次
      - level: applying
        zh: 在两套规则或两个任务之间来回切换而不固着（按颜色分类改按形状分类；两种玩法轮换）
        en: "Shifts back and forth between two rule sets or two tasks without getting stuck (sort by color, then by shape; alternate two game modes)"
        methods: [self_management, cognitive_behavioral, video_modeling, prompting]
        prereq_zh: 能自己想出 Plan B、能接受第二种办法
        examples_zh:
          - 先按颜色分卡片，换规则后改按形状分，能跟上
          - 同一副牌两种玩法轮流玩，切换时不坚持只用一种
        indicator_zh: 规则或任务切换时 5 次中≥4 次能顺利转换，不因固着而卡住
    citations: [wood_2009, steinbrenner_2020, nac_2015, kenworthy_2014, cannon_2011]

  - id: problem_solving
    name_zh: 问题解决步骤
    name_en: Problem-Solving Sequence
    targets:
      - level: emerging
        zh: 借视觉步骤卡,认出「有问题了」并说出问题是什么
        en: Uses a visual step card to notice there is a problem and name it
        methods: [task_analysis, visual_supports, cognitive_behavioral, prompting]
        prereq_zh: 基本情绪/情境命名
        examples_zh:
          - 拉链卡住了,能说「拉链坏了,这是问题」
          - 找不到鞋子,能指着步骤卡说出问题
        indicator_zh: 遇到问题时 5 次中≥3 次能在提示内说出「问题是什么」
      - level: developing
        zh: 走完「找问题→想 2 个办法→选一个→试试看→检查好没好」的解决序列
        en: "Completes the sequence: find the problem, think of two options, pick one, try it, check"
        methods: [task_analysis, cognitive_behavioral, video_modeling, modeling, self_management]
        prereq_zh: 能认出并说出问题
        examples_zh:
          - 积木不够高,想到「加长或换大块」,选一个,搭好后检查
          - 和同伴都想玩同一个玩具,想到「轮流或一起玩」,选一个试
        indicator_zh: 在支持下独立走完 5 步序列并得到可行方案,3 次中≥2 次
      - level: applying
        zh: 在真实社交/游戏情境中自发使用问题解决步骤并评估结果
        en: Spontaneously applies the problem-solving steps in real play or social situations and evaluates the outcome
        methods: [self_management, cognitive_behavioral, video_modeling, reinforcement]
        prereq_zh: 能在支持下走完 5 步序列
        examples_zh:
          - 桌游规则有争议时,自己提议一个大家同意的办法
          - 方案没用时能回到「再选一个」而不是放弃
        indicator_zh: 每周在自然情境中自发完整使用问题解决步骤≥3 次并说出结果好不好
    citations: [steinbrenner_2020, nac_2015, wood_2009, kenworthy_2014, cannon_2011]

  - id: waiting_tolerating_no
    name_zh: 等待与接受「不行」
    name_en: "Waiting, Tolerating No & Delayed Gratification"
    targets:
      - level: emerging
        zh: 借视觉计时/代币,在短暂延迟(数到 10 或计时 1 分钟)后获得想要的东西
        en: Waits through a short delay (count to 10 or a 1-minute timer) using a visual timer or token, then gets the item
        methods: [visual_supports, time_delay, reinforcement, prompting]
        prereq_zh: 能理解「先……再……」
        examples_zh:
          - 看着计时器等 1 分钟再拿零食
          - 集齐 3 个代币后换取想玩的玩具
        indicator_zh: 借视觉支持完成约定延迟,5 次中≥4 次能平稳等待
      - level: developing
        zh: 接受「现在不行/等一下」,用一句自我对话平复并转向可做的事
        en: "Accepts 'no' or 'wait', uses a calming self-talk phrase, and shifts to something available"
        methods: [cognitive_behavioral, social_narratives, self_management, visual_supports]
        prereq_zh: 能在视觉支持下短暂等待
        examples_zh:
          - 听到「现在不能买」时说「下次再买」并继续逛
          - 轮不到自己时说「等一下就好」并先做别的
        indicator_zh: 面对「不行或等待」时 3 次中≥2 次能自我平复且不升级
      - level: applying
        zh: 在真实游戏或竞赛中接受输赢或「不是第一」的结果，用应对语自我平复并继续参与
        en: "Accepts winning, losing, or not being first in real games or contests, self-calming with a coping phrase and staying in the activity"
        methods: [cognitive_behavioral, social_narratives, self_management, video_modeling]
        prereq_zh: 能接受「不行或等一下」并自我平复
        examples_zh:
          - 桌游输了说「下次再努力」，不掀桌、继续玩下一局
          - 赛跑不是第一，能为赢的同伴鼓掌
        indicator_zh: 面对输了或不是第一时 3 次中≥2 次能自我平复并继续参与，不升级为崩溃
    citations: [lee_2007, nac_2015, steinbrenner_2020, wood_2009]

  - id: self_monitoring
    name_zh: 停一停,想一想(冲动暂停)
    name_en: Stop-and-Think (Impulse Pause)
    targets:
      - level: emerging
        zh: 在提示下做出「停」的动作(手势或停止卡)并暂停当前冲动
        en: Performs a stop action (gesture or stop card) on cue and pauses the current impulse
        methods: [visual_supports, prompting, modeling, reinforcement]
        prereq_zh: 能模仿简单动作
        examples_zh:
          - 看到「停」手势时把手放下、先不抢
          - 想冲出去前,听到「停」能先站住
        indicator_zh: 给出停止提示时 5 次中≥3 次能暂停动作
      - level: developing
        zh: 自己用「停一停—想一想—再行动」把冲动和反应隔开
        en: Uses a self-directed stop, think, then act routine to separate impulse from response
        methods: [self_management, cognitive_behavioral, visual_supports, video_modeling]
        prereq_zh: 能在提示下暂停冲动
        examples_zh:
          - 生气想推人前,先深呼吸再选一个办法
          - 抢答前先举手,等叫到再说
        indicator_zh: 自然情境中自发使用停一停想一想,每周记录≥3 次
      - level: applying
        zh: 把停一停想一想与情绪调节/问题解决连起来,自我监控并记录
        en: Links stop-and-think with emotion regulation and problem-solving, self-monitoring and recording it
        methods: [self_management, cognitive_behavioral, visual_supports]
        prereq_zh: 能自发使用停一停想一想
        examples_zh:
          - 察觉自己进入「黄区」时先停,再用问题解决步骤
          - 用自我记录表打钩记下今天成功停下来几次
        indicator_zh: 一周内独立完成自我监控记录≥4 天,并至少 1 次衔接到问题解决步骤
    citations: [lee_2007, wood_2009, kuypers_2011, buron_curtis_2003]

notes_zh:
  - 目标须依据评估的当前发展水平选取并个别化调整;所有产出均为需专业审核的草稿。
  - 认知灵活性/执行功能干预的证据基础仍在积累;本库以认知行为策略、自我管理、视觉支持、社交叙事等已确立方法为落点,不对特定课程夸大疗效。
  - methods 仅列「证据上适配该目标」的方法;具体到某个孩子由专业人员定夺。
  - 执行功能证据(Unstuck and On Target 课程 [[cannon_2011]] 与其 RCT [[kenworthy_2014]])已核验入库,现为 verify:true,商用前再终核一次原文。
